[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hibernator-skill"
version = "0.1.0"
description = "Git-aware, human-controlled local project hibernation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
hibernator = "hibernator.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
".agents/skills/hibernator" = [".agents/skills/hibernator/SKILL.md"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
